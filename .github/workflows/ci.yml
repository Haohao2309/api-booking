name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: booking
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and security tests, package
        run: bash ./mvnw --batch-mode verify
      - name: Start with PostgreSQL and check health
        env:
          DB_PASSWORD: ci-only-password
          DB_URL: jdbc:postgresql://localhost:5432/booking
        run: |
          java -jar target/api-booking-0.0.1-SNAPSHOT.jar > /tmp/booking-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/health | grep -q '"UP"'; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          cat /tmp/booking-api.log
          exit 1
